version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Belem
    open-pull-requests-limit: 5
    groups:
      npm-patch-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/angular"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: America/Belem
    open-pull-requests-limit: 5
    groups:
      angular-patch-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/Belem
    open-pull-requests-limit: 5
