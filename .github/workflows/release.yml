name: Linux release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            angular/package-lock.json

      - name: Resolve release version
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          release_tag="v${package_version}"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags https://github.com/${GITHUB_REPOSITORY}.git "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "Release tag $release_tag already exists; nothing to publish."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Preparing new release $release_tag from validated commit $GITHUB_SHA"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Electron dependencies
        if: steps.release_meta.outputs.should_release == 'true'
        run: npm ci

      - name: Install Angular dependencies
        if: steps.release_meta.outputs.should_release == 'true'
        run: npm ci --prefix angular

      - name: Generate build metadata
        if: steps.release_meta.outputs.should_release == 'true'
        run: npm run build:info

      - name: Build Angular
        if: steps.release_meta.outputs.should_release == 'true'
        run: npm run build --prefix angular --omit=dev

      - name: Build Electron TypeScript
        if: steps.release_meta.outputs.should_release == 'true'
        run: npm run build

      - name: Re-run release-critical tests
        if: steps.release_meta.outputs.should_release == 'true'
        run: node --test dist/src/tests/core.test.js dist/src/tests/ul-progress.test.js

      - name: Build Linux packages
        if: steps.release_meta.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools
          for attempt in 1 2 3; do
            rm -rf build
            npx electron-builder --linux --publish never && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done

      - name: Generate SHA256SUMS
        if: steps.release_meta.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          cd build
          find . -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pacman' -o -iname '*.appimage' \) -printf '%f\n' | sort | while IFS= read -r file; do
            sha256sum "$file"
          done > SHA256SUMS
          test -s SHA256SUMS

      - name: Publish GitHub Release
        if: steps.release_meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          name: ${{ steps.release_meta.outputs.release_tag }}
          generate_release_notes: true
          files: |
            build/*.deb
            build/*.rpm
            build/*.pacman
            build/*.AppImage
            build/*.appimage
            build/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
