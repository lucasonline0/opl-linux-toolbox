name: Linux release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - package.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve and validate release version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release_tag="${GITHUB_REF_NAME}"
            tag_version="${release_tag#v}"
            if [ "$tag_version" != "$package_version" ]; then
              echo "Tag $release_tag does not match package.json version $package_version" >&2
              exit 1
            fi
          else
            release_tag="v${package_version}"
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Install Electron dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            rm -rf node_modules
            sleep 3
          done

      - name: Install Angular dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            npm ci --prefix angular && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            rm -rf angular/node_modules
            sleep 3
          done

      - name: Generate build metadata
        run: npm run build:info

      - name: Build Angular
        run: npm run build --prefix angular --omit=dev

      - name: Build Electron TypeScript
        run: npm run build

      - name: Build Linux packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools
          for attempt in 1 2 3; do
            rm -rf build
            npx electron-builder --linux --publish never && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd build
          find . -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pacman' -o -iname '*.appimage' \) -printf '%f\n' | sort | while IFS= read -r file; do
            sha256sum "$file"
          done > SHA256SUMS
          test -s SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            build/*.deb
            build/*.rpm
            build/*.pacman
            build/*.AppImage
            build/*.appimage
            build/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
