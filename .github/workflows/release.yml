name: Linux release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag $TAG does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Install Electron dependencies
        run: npm ci

      - name: Install Angular dependencies
        run: npm ci --prefix angular

      - name: Generate build metadata
        run: npm run build:info

      - name: Build Angular
        run: npm run build --prefix angular --omit=dev

      - name: Build Electron and run core tests
        run: npm run test:core

      - name: Build Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools
          npx electron-builder --linux

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd build
          find . -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pacman' -o -iname '*.appimage' \) -printf '%f\n' | sort | while IFS= read -r file; do
            sha256sum "$file"
          done > SHA256SUMS
          test -s SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/*.deb
            build/*.rpm
            build/*.pacman
            build/*.AppImage
            build/*.appimage
            build/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
