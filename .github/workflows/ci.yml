name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'agent/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Electron dependencies
        run: npm ci

      - name: Install Angular dependencies
        run: npm ci --prefix angular

      - name: Generate build metadata
        run: npm run build:info

      - name: Build Angular
        run: npm run build --prefix angular --omit=dev

      - name: Run core tests and build Electron
        run: npm run test:core
