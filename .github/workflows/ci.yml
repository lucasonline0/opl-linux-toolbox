name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-angular-lock:
    name: Refresh vulnerable Angular lockfile
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/import-progress-ci-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular/package-lock.json

      - name: Refresh safe Angular lockfile updates
        run: npm --prefix angular audit fix --package-lock-only --omit=dev

      - name: Require clean production dependency audit
        run: npm --prefix angular audit --omit=dev --audit-level=high

      - name: Ensure package manifest was not rewritten
        run: git diff --exit-code -- angular/package.json

      - name: Commit lockfile refresh
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- angular/package-lock.json; then
            echo "Angular lockfile already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular/package-lock.json
          git commit -m "chore: refresh vulnerable Angular dependencies"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  validate:
    name: Build, tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            angular/package-lock.json

      - name: Install Electron dependencies
        run: npm ci

      - name: Install Angular dependencies
        run: npm ci --prefix angular

      - name: Validate shell scripts
        run: npm run check:shell

      - name: Validate bundled helpers
        run: |
          test -x assets/bin/iso2opl
          test -s assets/bin/iso2opl.NOTICE.txt
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md

      - name: Generate build metadata
        run: npm run build:info

      - name: Build Electron TypeScript
        run: npm run build

      - name: Run core tests
        run: node --test dist/src/tests/core.test.js dist/src/tests/ul-progress.test.js

      - name: Build Angular
        run: npm run build --prefix angular --omit=dev

      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts

  package-smoke:
    name: Linux AppImage packaging smoke test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            angular/package-lock.json

      - name: Install Electron dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Install Angular dependencies
        run: npm ci --prefix angular

      - name: Build application
        run: |
          npm run build:info
          npm run build --prefix angular --omit=dev
          npm run build

      - name: Build AppImage
        run: npx electron-builder --linux AppImage --publish never

      - name: Validate artifact
        run: |
          test -n "$(find build -maxdepth 1 -type f -iname '*.AppImage' -print -quit)"
          sha256sum build/*.AppImage
