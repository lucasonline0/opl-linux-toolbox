name: Refresh Angular dependency lock

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: refresh-angular-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.head_ref == 'feat/import-progress-ci-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Rebuild Angular lockfile from patched manifest
        shell: bash
        run: |
          set -euo pipefail
          rm angular/package-lock.json
          npm install --prefix angular --package-lock-only --ignore-scripts

      - name: Require clean production dependency audit
        run: npm --prefix angular audit --omit=dev --audit-level=high

      - name: Ensure package manifest was not rewritten
        run: git diff --exit-code -- angular/package.json

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angular/package-lock.json
          git commit -m "chore: refresh Angular dependency lock"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
