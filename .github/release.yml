changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - github-actions[bot]
  categories:
    - title: "Features"
      labels:
        - feature
        - enhancement
    - title: "Safety & reliability"
      labels:
        - security
        - reliability
        - safety
    - title: "Fixes"
      labels:
        - bug
        - fix
    - title: "Packaging & distribution"
      labels:
        - packaging
        - release
        - distribution
    - title: "Documentation"
      labels:
        - documentation
        - docs
    - title: "Maintenance"
      labels:
        - maintenance
        - dependencies
        - chore
    - title: "Other changes"
      labels:
        - "*"
